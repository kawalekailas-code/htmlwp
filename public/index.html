<!DOCTYPE html>
<html>
<body>

<h2>🔥 WhatsApp PRO SaaS Tool</h2>

<input id="token" placeholder="Access Token"><br><br>
<input id="phone_id" placeholder="Phone Number ID"><br><br>
<input id="waba" placeholder="WABA ID"><br><br>

<button onclick="loadTemplates()">📥 Load Templates</button><br><br>

<select id="template"></select><br><br>

<label>Upload image or video (WhatsApp video: MP4):</label><br>
<input type="file" id="image" accept="image/*,video/mp4"><br><small>Video template must have a VIDEO header. Upload limit here: 100 MB (WhatsApp may reject videos above its own limit).</small><br><br>

<label>Upload CSV:</label><br>
<input type="file" id="csv"><br><br>

<button onclick="start()">🚀 Start Campaign</button>

<h3>📊 Result</h3>
<div>
  ✅ Success: <span id="success">0</span><br>
  ❌ Failed: <span id="failed">0</span><br>
  <span id="errorMessage" style="color:#b00020"></span>
</div>

<script>

let successCount = 0;
let failCount = 0;
let mediaIdGlobal = null;
let mediaTypeGlobal = "image"; // 🔥 NEW

function updateUI(){
  document.getElementById("success").innerText = successCount;
  document.getElementById("failed").innerText = failCount;
}

function tokenEl(){ return document.getElementById("token"); }
function phoneEl(){ return document.getElementById("phone_id"); }
function templateEl(){ return document.getElementById("template"); }
function wabaEl(){ return document.getElementById("waba"); }

// TEMPLATE FETCH
async function loadTemplates(){
  const res = await fetch(`/templates?token=${tokenEl().value}&waba=${wabaEl().value}`);
  const d = await res.json();

  templateEl().innerHTML = "";

  if(d.status === "error") return;

  d.data.forEach(t=>{
    let o = document.createElement("option");
    o.value = t.name;
    o.text = t.name;
    templateEl().appendChild(o);
  });
}

// CSV parse
function parseCSV(text){
  return text
    .replace(/\r/g, "")
    .split("\n")
    .slice(1)
    .map(x => x.trim())
    .filter(x => x !== "")
    .map(x => ({ phone: x }));
}

// 🔥 UPDATED: Upload Image/Video
async function uploadImage(){
  const file = document.getElementById("image").files[0];
  if(!file) return null;

  // This app accepts MP4 videos up to 100 MB; Meta may enforce a lower send limit.
  if (file.type.startsWith("video/")) {
    if (file.type !== "video/mp4" || !file.name.toLowerCase().endsWith(".mp4")) {
      throw new Error("व्हिडिओ MP4 format मध्ये असणे आवश्यक आहे.");
    }
    if (file.size > 100 * 1024 * 1024) {
      throw new Error("व्हिडिओचा आकार 100 MB पेक्षा कमी असावा.");
    }
    mediaTypeGlobal = "video";
  } else if (file.type.startsWith("image/")) {
    mediaTypeGlobal = "image";
  } else {
    throw new Error("कृपया image किंवा MP4 video निवडा.");
  }

  const form = new FormData();
  form.append("file", file);
  form.append("token", tokenEl().value);
  form.append("phone_id", phoneEl().value);

  const res = await fetch("/upload-media", {
    method: "POST",
    body: form
  });

  const d = await res.json();
  if (d.status !== "success" || !d.id) {
    throw new Error(d.message || "Media upload अयशस्वी झाले.");
  }
  return d.id;
}

// 🔥 UPDATED: Send dynamic media
async function send(row){
  try{

    let mediaParam = {
      type: mediaTypeGlobal
    };

    if(mediaTypeGlobal === "image"){
      mediaParam.image = { id: mediaIdGlobal };
    } else {
      mediaParam.video = { id: mediaIdGlobal };
    }

    const payload = {
      messaging_product: "whatsapp",
      to: row.phone,
      type: "template",
      template: {
        name: templateEl().value,
        language: { code: "mr" },
        components: [
          {
            type: "header",
            parameters: [mediaParam]
          }
        ]
      }
    };

    const res = await fetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token: tokenEl().value,
        phone_id: phoneEl().value,
        payload
      })
    });

    const d = await res.json();

    if(d.status === "success"){
      successCount++;
    } else {
      failCount++;
      document.getElementById("errorMessage").innerText = "Send error: " + (d.message || "Unknown error") + (d.full?.error?.error_data?.details ? " — " + d.full.error.error_data.details : "");
    }

    updateUI();

  }catch(e){
    failCount++;
    document.getElementById("errorMessage").innerText = "Send error: " + (e.message || "Network error");
    updateUI();
  }
}

// Start
async function start(){
  successCount = 0;
  failCount = 0;
  updateUI();

  const file = document.getElementById("csv").files[0];
  if(!file) { alert("कृपया CSV file निवडा."); return; }
  if(!tokenEl().value || !phoneEl().value) { alert("Access Token आणि Phone Number ID भरा."); return; }

  try {
    mediaIdGlobal = await uploadImage();
    if (!mediaIdGlobal) { alert("कृपया पाठवण्यासाठी image किंवा MP4 video निवडा."); return; }
    const data = parseCSV(await file.text());
    if (!data.length) { alert("CSV मध्ये फोन नंबर नाहीत."); return; }

    for(let row of data){
      await send(row);
      await new Promise(r => setTimeout(r, 300));
    }
  } catch (e) {
    alert(e.message || "Campaign सुरू करता आली नाही.");
  }
}

</script>

</body>
</html>
