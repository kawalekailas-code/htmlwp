<!DOCTYPE html>
<html>
<body>

<h2>🔥 WhatsApp PRO SaaS Tool (Image)</h2>

<input id="token" placeholder="Access Token"><br><br>
<input id="phone_id" placeholder="Phone Number ID"><br><br>
<input id="waba" placeholder="WABA ID"><br><br>

<button onclick="loadTemplates()">📥 Load Templates</button><br><br>

<select id="template"></select><br><br>

<label>Upload Image:</label><br>
<input type="file" id="image"><br><br>

<label>Upload CSV:</label><br>
<input type="file" id="csv"><br><br>

<button onclick="start()">🚀 Start Campaign</button>

<pre id="log"></pre>

<script>

let failed = [];
let mediaIdGlobal = null;

function log(t){
  document.getElementById("log").innerHTML += t + "\\n";
}

function tokenEl(){ return document.getElementById("token"); }
function phoneEl(){ return document.getElementById("phone_id"); }
function templateEl(){ return document.getElementById("template"); }
function wabaEl(){ return document.getElementById("waba"); }

// 🔥 FIXED TEMPLATE FETCH
async function loadTemplates(){
  try{
    const res = await fetch(`/templates?token=${tokenEl().value}&waba=${wabaEl().value}`);
    const d = await res.json();

    console.log("TEMPLATE:", d);

    templateEl().innerHTML = "";

    if(d.status === "error"){
      log("❌ " + d.message);
      return;
    }

    if(!d.data || d.data.length === 0){
      log("❌ No templates found");
      return;
    }

    d.data.forEach(t=>{
      let o = document.createElement("option");
      o.value = t.name;
      o.text = t.name;
      templateEl().appendChild(o);
    });

    log("✅ Templates loaded");

  }catch(e){
    log("❌ Template fetch crash");
  }
}

// CSV parse
function parseCSV(text){
  return text
    .replace(/\r/g, "") // Windows fix
    .split("\n")
    .slice(1)
    .map(x => x.trim())
    .filter(x => x !== "")
    .map(x => ({ phone: x }));
}

// Upload image
async function uploadImage(){
  const file = document.getElementById("image").files[0];

  if(!file){
    log("❌ Image required");
    return null;
  }

  const form = new FormData();
  form.append("file", file);
  form.append("token", tokenEl().value);
  form.append("phone_id", phoneEl().value);

  const res = await fetch("/upload-media", {
    method: "POST",
    body: form
  });

  const d = await res.json();

  if(d.status === "success"){
    log("🖼️ Image uploaded");
    return d.id;
  }else{
    log("❌ Upload failed → " + d.message);
    return null;
  }
}

// Send message
async function send(row){
  try{
    const payload = {
      messaging_product: "whatsapp",
      to: row.phone,
      type: "template",
      template: {
        name: templateEl().value,
        language: { code: "en" },
        components: [
          {
            type: "header",
            parameters: [
              {
                type: "image",
                image: { id: mediaIdGlobal }
              }
            ]
          }
        ]
      }
    };

    const res = await fetch("/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        token: tokenEl().value,
        phone_id: phoneEl().value,
        payload
      })
    });

    const d = await res.json();

    if(d.status === "error"){
      log("❌ " + row.phone + " → " + d.message);
      failed.push(row.phone);
    } else {
      log("✅ " + row.phone);
    }

  }catch(e){
    log("❌ " + row.phone + " → Crash");
    failed.push(row.phone);
  }
}

// Start
async function start(){
  failed = [];

  const file = document.getElementById("csv").files[0];

  if(!file){
    log("❌ CSV upload kar");
    return;
  }

  mediaIdGlobal = await uploadImage();

  const text = await file.text();
  const data = parseCSV(text);

  log("🚀 Sending started...");
  log("📊 Total: " + data.length);

  for(let row of data){
    await send(row);
    await new Promise(r => setTimeout(r, 300));
  }

  log("🔥 Done");
  log("❌ Failed: " + failed.length);
}

</script>

</body>
</html>
